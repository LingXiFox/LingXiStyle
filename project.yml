name: LingXiStyle

options:
  bundleIdPrefix: com.lingxifox
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, zh-Hant, en, ja]

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.7.1"
    CURRENT_PROJECT_VERSION: "9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R9UJHHAZQ4
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  StylePortCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Core/Sources/StylePortCore
      - path: Core/Resources/Profiles
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.StylePortCore
        PRODUCT_NAME: StylePortCore
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: NO

  LingXiKit:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Kit/Sources/LingXiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.LingXiKit
        PRODUCT_NAME: LingXiKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  LingXiEngine:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Engine/Sources/LingXiEngine
    dependencies:
      - target: LingXiKit
      - target: StylePortCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.Engine
        PRODUCT_NAME: LingXiEngine
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  LingXiServices:
    type: framework
    platform: iOS
    sources:
      - path: Services/Sources/LingXiServices
    dependencies:
      - target: LingXiKit
      - target: LingXiEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.Services
        PRODUCT_NAME: LingXiServices
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  LingXiStyle:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes: ["Info.plist"]
      - path: Resources/Localization
        buildPhase: resources
    dependencies:
      - target: StylePortCore
        embed: true
      - target: LingXiKit
        embed: true
      - target: LingXiEngine
        embed: true
      - target: LingXiServices
        embed: true
      - target: LingXiStyleShare
        embed: true
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: 纹粒
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LingXiKeychainGroup: $(AppIdentifierPrefix)com.lingxifox.Texel.shared
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: 用于读取你选择的 HEIC 原片，并在本机追加纹理与颗粒。照片不会离开设备。
        NSPhotoLibraryAddUsageDescription: 用于把补好纹理与颗粒的照片存为相册中的新照片，原照片不会被修改。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/LingXiStyle.entitlements

  LingXiStyleShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension/Sources
      - path: ShareExtension/Resources
        excludes: ["Info.plist"]
      - path: Resources/Localization
        buildPhase: resources
        excludes: ["AppShortcuts.xcstrings"]
    dependencies:
      - target: StylePortCore
        embed: true
      - target: LingXiKit
        embed: true
      - target: LingXiEngine
        embed: true
      - target: LingXiServices
        embed: true
    info:
      path: ShareExtension/Resources/Info.plist
      properties:
        CFBundleDisplayName: 纹粒
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryAddUsageDescription: 用于把补好纹理与颗粒的照片存为相册中的新照片，原照片不会被修改。
        LingXiKeychainGroup: $(AppIdentifierPrefix)com.lingxifox.Texel.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.Share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Resources/LingXiStyleShare.entitlements

  LingXiKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Kit/Tests/LingXiKitTests
    dependencies:
      - target: LingXiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.LingXiKitTests
        GENERATE_INFOPLIST_FILE: YES

  LingXiPurchaseHost:
    type: application
    platform: iOS
    sources:
      - path: Tests/PurchaseHost
    info:
      path: Tests/PurchaseHost/Info.plist
      properties:
        CFBundleDisplayName: LingXiStyle Purchase Host
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.PurchaseHost
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

  LingXiPurchaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LingXiPurchaseTests
      - path: Configuration.storekit
        buildPhase: resources
    dependencies:
      - target: LingXiPurchaseHost
      - target: LingXiKit
      - target: LingXiServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.PurchaseTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LingXiPurchaseHost.app/LingXiPurchaseHost
        BUNDLE_LOADER: $(TEST_HOST)
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PLATFORM_DIR)/Developer/Library/Frameworks
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - StoreKitTest

  LingXiIntegrationHost:
    type: application
    platform: iOS
    sources:
      - path: Tests/IntegrationHost
    dependencies:
      - target: StylePortCore
        embed: true
      - target: LingXiKit
        embed: true
      - target: LingXiEngine
        embed: true
      - target: LingXiServices
        embed: true
    info:
      path: Tests/IntegrationHost/Info.plist
      properties:
        CFBundleDisplayName: Texel Integration Host
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: Hosts on-device HEIC conversion tests that read the selected original.
        NSPhotoLibraryAddUsageDescription: Saves converted HEIC test output to the simulator photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.IntegrationHost
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

  LingXiIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LingXiIntegrationTests
      - path: ShareExtension/Sources/ShareViewController.swift
      - path: App/Sources/Integrations/Shortcuts/UnlockTextureIntent.swift
      - path: Tests/Fixtures/IMG_5296.HEIC
        buildPhase: resources
    dependencies:
      - target: LingXiIntegrationHost
      - target: LingXiKit
      - target: LingXiEngine
      - target: LingXiServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.IntegrationTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LingXiIntegrationHost.app/LingXiIntegrationHost
        BUNDLE_LOADER: $(TEST_HOST)

  LingXiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/LingXiUITests
    dependencies:
      - target: LingXiStyle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LingXiStyle

  LingXiEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Engine/Tests/LingXiEngineTests
    dependencies:
      - target: LingXiEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.EngineTests
        GENERATE_INFOPLIST_FILE: YES

  StylePortCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Core/Tests/StylePortCoreTests
    dependencies:
      - target: StylePortCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.Texel.StylePortCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LingXiStyle:
    build:
      targets:
        LingXiStyle: all
    run:
      config: Debug
      storeKitConfiguration: Configuration.storekit
    archive:
      config: Release
  LingXiKitTests:
    build:
      targets:
        LingXiKit: all
        LingXiKitTests: [test]
    test:
      config: Debug
      targets:
        - LingXiKitTests
  LingXiPurchaseTests:
    build:
      targets:
        LingXiPurchaseHost: all
        LingXiPurchaseTests: [test]
    test:
      config: Debug
      targets:
        - LingXiPurchaseTests
  LingXiIntegrationTests:
    build:
      targets:
        LingXiIntegrationHost: all
        LingXiIntegrationTests: [test]
    test:
      config: Debug
      targets:
        - LingXiIntegrationTests
  LingXiUITests:
    build:
      targets:
        LingXiStyle: all
        LingXiUITests: [test]
    test:
      config: Debug
      targets:
        - LingXiUITests
  LingXiEngineTests:
    build:
      targets:
        LingXiEngine: all
        LingXiEngineTests: [test]
    test:
      config: Debug
      targets:
        - LingXiEngineTests
  StylePortCoreTests:
    build:
      targets:
        StylePortCore: all
        StylePortCoreTests: [test]
    test:
      config: Debug
      targets:
        - StylePortCoreTests
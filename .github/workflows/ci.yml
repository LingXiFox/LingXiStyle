name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData

jobs:
  policy:
    name: Policy and project checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode and install XcodeGen
        uses: ./.github/actions/setup
        with:
          xcode: /Applications/Xcode_16.4.app

      - name: Validate project.yml and generated project
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --exit-code -- LingXiStyle.xcodeproj

      - name: Validate localization catalogs
        run: |
          python3 - <<'PY'
          import glob
          import json
          import sys

          languages = ("zh-Hans", "zh-Hant", "en", "ja")
          failures = []
          for path in glob.glob("**/*.xcstrings", recursive=True):
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              strings = data.get("strings", {})
              print(f"{path}: {len(strings)} keys")
              for key, entry in strings.items():
                  localizations = entry.get("localizations", {})
                  for language in languages:
                      value = localizations.get(language, {}).get("stringUnit", {}).get("value")
                      if not value:
                          failures.append(f"{path}: {key!r} missing {language}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)

          with open("Resources/Localization/InfoPlist.xcstrings", encoding="utf-8") as handle:
              info = json.load(handle)["strings"]
          expected = {
              "zh-Hans": "纹粒",
              "zh-Hant": "Texel",
              "en": "Texel",
              "ja": "Texel",
          }
          for language, name in expected.items():
              value = info["CFBundleDisplayName"]["localizations"][language]["stringUnit"]["value"]
              if value != name:
                  failures.append(f"CFBundleDisplayName {language}: {value!r} != {name!r}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("All catalogs have four non-empty localizations and the expected display names.")
          PY

      - name: Validate StoreKit product configuration
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("Configuration.storekit", encoding="utf-8") as handle:
              data = json.load(handle)
          products = data.get("products", [])
          if len(products) != 1:
              sys.exit(f"Expected exactly one StoreKit product, found {len(products)}")
          product = products[0]
          if product.get("productID") != "com.lingxifox.LingXiStyle.pro":
              sys.exit(f"Unexpected product ID: {product.get('productID')!r}")
          if product.get("type") != "NonConsumable":
              sys.exit(f"Pro must stay a NonConsumable: {product.get('type')!r}")
          if product.get("displayPrice") != "2.99":
              sys.exit(f"Unexpected local test price: {product.get('displayPrice')!r}")
          offer_codes = product.get("offerCodes", [])
          if not any(code.get("referenceName") == "DEVELOPER_FREE" and code.get("displayPrice") == "0"
                     for code in offer_codes):
              sys.exit("The local DEVELOPER_FREE offer code is missing")
          if data.get("settings", {}).get("_developerTeamID"):
              sys.exit("Configuration.storekit must not record a real developer team ID")
          print("StoreKit product, price, and free offer code match the release policy.")
          PY

      - name: Scan for credentials and signing assets
        run: |
          set -euo pipefail
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'; then
            echo "A private key is tracked in the repository." >&2
            exit 1
          fi
          assets=$(find . -path ./.git -prune -o \
            \( -name '*.p12' -o -name '*.p8' -o -name '*.mobileprovision' -o -name '*.cer' -o -name '*.key' \) \
            -print)
          if [ -n "$assets" ]; then
            echo "Signing assets must not be committed:" >&2
            echo "$assets" >&2
            exit 1
          fi
          if git grep -nE -- '_developerTeamID"[[:space:]]*:[[:space:]]*"[A-Z0-9]{10}"'; then
            echo "A real Apple Developer Team ID is recorded in Configuration.storekit." >&2
            exit 1
          fi
          echo "No private keys, signing assets, or recorded team ID found."

  macos-tests:
    name: macOS unit tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode and install XcodeGen
        uses: ./.github/actions/setup
        with:
          xcode: /Applications/Xcode_16.4.app

      - name: Generate project
        run: xcodegen generate

      - name: Run Kit tests
        run: |
          set -euo pipefail
          mkdir -p .build/logs
          xcodebuild -project LingXiStyle.xcodeproj \
            -scheme LingXiKitTests -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" -parallel-testing-enabled NO test \
            2>&1 | tee .build/logs/kit-tests.log

      - name: Run Engine tests
        run: |
          set -euo pipefail
          xcodebuild -project LingXiStyle.xcodeproj \
            -scheme LingXiEngineTests -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" -parallel-testing-enabled NO test \
            2>&1 | tee .build/logs/engine-tests.log

      - name: Run Core tests
        run: |
          set -euo pipefail
          xcodebuild -project LingXiStyle.xcodeproj \
            -scheme StylePortCoreTests -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" -parallel-testing-enabled NO test \
            2>&1 | tee .build/logs/core-tests.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-tests-logs
          path: .build/logs
          if-no-files-found: ignore

  ios-build-and-test:
    name: iOS ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Indexing is not needed in CI and roughly doubles clean build time.
      COMPILER_INDEX_STORE_ENABLE: NO
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 18.5 compatibility
            xcode: /Applications/Xcode_16.4.app
            runtime: iOS-18
            artifact: ios-18
          - label: 26.x current
            xcode: /Applications/Xcode_26.3.app
            runtime: iOS-26
            artifact: ios-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode and install XcodeGen
        uses: ./.github/actions/setup
        with:
          xcode: ${{ matrix.xcode }}

      - name: Generate project
        run: xcodegen generate

      - name: Select simulator runtime
        id: simulator
        env:
          RUNTIME_PREFIX: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/simulators.json
          DEVICE_ID=$(python3 - <<'PY'
          import json
          import os
          import sys

          prefix = "com.apple.CoreSimulator.SimRuntime." + os.environ["RUNTIME_PREFIX"]
          with open("/tmp/simulators.json", encoding="utf-8") as handle:
              data = json.load(handle)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if not runtime.startswith(prefix):
                  continue
              for device in devices:
                  if not device.get("isAvailable", False):
                      continue
                  if not device.get("name", "").startswith("iPhone"):
                      continue
                  rank = 0 if device["name"].startswith("iPhone 16") else 1
                  candidates.append((rank, runtime, device["name"], device["udid"]))
          if not candidates:
              print("No available iPhone simulator for the requested runtime.", file=sys.stderr)
              print(json.dumps(data, indent=2), file=sys.stderr)
              sys.exit(1)
          chosen = sorted(candidates)[0]
          print(f"Using {chosen[2]} ({chosen[1]}) {chosen[3]}", file=sys.stderr)
          print(chosen[3])
          PY
          )
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Start simulator in the background
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true

      - name: Build Debug for iOS
        run: |
          set -euo pipefail
          mkdir -p .build/logs
          xcodebuild -project LingXiStyle.xcodeproj \
            -scheme LingXiStyle -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .build/logs/debug.log
          if grep -E 'warning:' .build/logs/debug.log \
              | grep -vE 'appintentsmetadataprocessor|Metadata extraction skipped'; then
            echo "Unexpected compiler warning in the Debug build." >&2
            exit 1
          fi

      - name: Build Release for iOS
        run: |
          set -euo pipefail
          xcodebuild -project LingXiStyle.xcodeproj \
            -scheme LingXiStyle -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .build/logs/release.log
          if grep -E 'warning:' .build/logs/release.log \
              | grep -vE 'appintentsmetadataprocessor|Metadata extraction skipped'; then
            echo "Unexpected compiler warning in the Release build." >&2
            exit 1
          fi

      - name: Run purchase and keychain tests
        timeout-minutes: 30
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.simulator.outputs.device_id }}"
          bash .github/scripts/boot-simulator.sh "$DEVICE_ID" 180
          # StoreKitTest's first purchase on the iOS 18.5 runtime has taken
          # 107-571s while its daemon starts. Keep the assertion timeout well
          # above that observed cold start; do not use it to hide a real hang.
          xcodebuild -project LingXiStyle.xcodeproj \
            -scheme LingXiPurchaseTests -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath "$DERIVED_DATA" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 900 \
            test 2>&1 | tee .build/logs/purchase-tests.log

      - name: Run conversion, share, and shortcut integration tests
        timeout-minutes: 20
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -euo pipefail
          mkdir -p .build/logs
          bash .github/scripts/boot-simulator.sh "$DEVICE_ID" 180
          # Build the simulator products with ad-hoc signing. PhotoKit's TCC
          # identity is tied to the signed app on older simulator runtimes.
          xcodebuild -project LingXiStyle.xcodeproj \
            -scheme LingXiIntegrationTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$DERIVED_DATA" build-for-testing \
            2>&1 | tee .build/logs/integration-build.log
          HOST_APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/LingXiIntegrationHost.app"
          echo "install start $(date -u +%H:%M:%S)"
          xcrun simctl install "$DEVICE_ID" "$HOST_APP"
          echo "install done $(date -u +%H:%M:%S)"
          BUNDLE_ID="com.lingxifox.Texel.IntegrationHost"
          TEST_BUNDLE_ID="com.lingxifox.Texel.IntegrationTests"
          # TCC attributes access to the host process, but some simulator runtimes
          # consult the embedded test bundle as the responsible process. Grant both
          # and do not pre-launch the host, so no stale notDetermined state is cached.
          xcrun simctl privacy "$DEVICE_ID" grant photos "$BUNDLE_ID"
          xcrun simctl privacy "$DEVICE_ID" grant photos-add "$BUNDLE_ID"
          xcrun simctl privacy "$DEVICE_ID" grant photos "$TEST_BUNDLE_ID" || true
          xcrun simctl privacy "$DEVICE_ID" grant photos-add "$TEST_BUNDLE_ID" || true
          xcrun simctl spawn "$DEVICE_ID" launchctl kickstart -k system/com.apple.tccd || true
          # iOS 26's simctl writes kTCCServicePhotos with auth_version=1, which
          # PhotoKit ignores even though TCC reports authorized. A real in-app
          # grant stores auth_version=2. Update it while the simulator is shut
          # down, then reboot so tccd and PhotoKit reload the grant. This is a
          # simulator-runtime bug, not app behavior; tests still require real
          # read/write access and fail if this workaround stops working.
          xcrun simctl shutdown "$DEVICE_ID"
          TCC_DB="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE_ID/data/Library/TCC/TCC.db"
          if [ ! -f "$TCC_DB" ]; then
            echo "TCC database not found at $TCC_DB" >&2
            exit 1
          fi
          sqlite3 "$TCC_DB" \
            "UPDATE access SET auth_value=2, auth_version=2 WHERE service='kTCCServicePhotos' AND client IN ('$BUNDLE_ID', '$TEST_BUNDLE_ID'); PRAGMA wal_checkpoint(FULL);"
          PHOTOS_GRANTS=$(sqlite3 "$TCC_DB" \
            "SELECT COUNT(*) FROM access WHERE service='kTCCServicePhotos' AND client='$BUNDLE_ID' AND auth_value=2 AND auth_version=2;")
          if [ "$PHOTOS_GRANTS" -eq 0 ]; then
            echo "PhotoKit read/write grant is missing or not version 2" >&2
            exit 1
          fi
          bash .github/scripts/boot-simulator.sh "$DEVICE_ID" 180
          sqlite3 "$TCC_DB" \
            "SELECT service, client, client_type, auth_value, auth_reason, auth_version FROM access WHERE client IN ('$BUNDLE_ID', '$TEST_BUNDLE_ID') AND service IN ('kTCCServicePhotos', 'kTCCServicePhotosAdd') ORDER BY service, client;" \
            | tee .build/logs/photo-tcc-before.log
          xcodebuild -project LingXiStyle.xcodeproj \
            -scheme LingXiIntegrationTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$DERIVED_DATA" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            test-without-building \
            2>&1 | tee .build/logs/integration-tests.log

      - name: Collect PhotoKit permission diagnostics
        if: always()
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -uo pipefail
          mkdir -p .build/logs
          LOG=.build/logs/photo-permission-diagnostics.log
          {
            echo "== TCC rows after the test run =="
            TCC_DB="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE_ID/data/Library/TCC/TCC.db"
            if [ -f "$TCC_DB" ]; then
              sqlite3 "$TCC_DB" \
                "SELECT service, client, auth_value, auth_reason, auth_version FROM access WHERE service IN ('kTCCServicePhotos', 'kTCCServicePhotosAdd') ORDER BY service, client;" || true
            else
              echo "TCC database not found at $TCC_DB"
            fi
            echo "== Installed integration host =="
            xcrun simctl get_app_container "$DEVICE_ID" com.lingxifox.Texel.IntegrationHost app || true
            HOST_APP=$(xcrun simctl get_app_container "$DEVICE_ID" com.lingxifox.Texel.IntegrationHost app 2>/dev/null || true)
            if [ -n "${HOST_APP:-}" ] && [ -d "$HOST_APP" ]; then
              codesign -dv --verbose=4 "$HOST_APP" 2>&1 | head -30 || true
              /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryUsageDescription' "$HOST_APP/Info.plist" 2>&1 || true
              /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryAddUsageDescription' "$HOST_APP/Info.plist" 2>&1 || true
            fi
          } | tee "$LOG"

      - name: Run launch smoke test
        timeout-minutes: 15
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -euo pipefail
          xcodebuild -project LingXiStyle.xcodeproj \
            -scheme LingXiUITests -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$DERIVED_DATA" -parallel-testing-enabled NO \
            test CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .build/logs/ui-smoke.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-logs
          path: .build/logs
          if-no-files-found: ignore
